<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprite Animation Gallery</title>
    <style>
        body {
            margin: 0;
            /* New Theme Background */
            background-color: #33FFC7;
            /* Dark text for contrast */
            color: #0f172a;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 5rem;
        }

        /* Fixed Header for Controls */
        .controls-header {
            position: sticky;
            top: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 1rem 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            z-index: 100;
            box-shadow: 0 4px 15px -3px rgba(0, 0, 0, 0.1);
            flex-wrap: wrap; /* Important for mobile */
        }

        .controls-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #1e293b;
            margin: 0;
            display: none; /* Hide title on very small screens to save space */
        }

        @media (min-width: 600px) {
            .controls-title {
                display: block;
            }
            .controls-header {
                padding: 1.5rem 0;
                gap: 1.5rem;
            }
        }

        button {
            background: #ffffff;
            border: 2px solid #cbd5e1;
            color: #334155;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            transition: all 0.2s ease;
        }

        button:hover {
            background: #f1f5f9;
            transform: scale(1.05);
        }

        button.active {
            background: #0f172a;
            color: #33FFC7;
            border-color: #0f172a;
        }

        /* Gallery Layout */
        .gallery {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3rem;
            width: 100%;
            max-width: 1100px;
            padding: 2rem 1rem;
            box-sizing: border-box;
        }

        .animation-row {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            background: #ffffff;
            padding: 2rem 1rem;
            border-radius: 24px;
            box-shadow: 0 20px 40px -15px rgba(0,0,0,0.2);
            box-sizing: border-box;
            overflow: hidden; /* Prevent horizontal scroll on mobile */
        }

        .row-title {
            margin: 0 0 1.5rem 0;
            font-size: 1.3rem;
            color: #0f172a;
            text-transform: capitalize;
            letter-spacing: 1px;
            border-bottom: 3px solid #33FFC7;
            padding-bottom: 0.5rem;
            text-align: center;
        }

        /* 
           Wrapper for the sprite to handle responsive scaling.
           We use flex to center it, and JS will apply transform: scale() 
           to the sprite-container if the screen is too small.
        */
        .sprite-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .sprite-container {
            /* Default fallback sizes */
            width: 300px;
            height: 300px;
            background-repeat: no-repeat;
            background-position: 0px 0px;
            transform-origin: top center; /* Scale from the top middle */
        }

    </style>
</head>
<body>

    <!-- Floating Sticky Controls -->
    <div class="controls-header">
        <h2 class="controls-title">Speed:</h2>
        <button onclick="setFPS(24)" id="btn-24">24 FPS</button>
        <button onclick="setFPS(30)" id="btn-30">30 FPS</button>
        <button onclick="setFPS(60)" id="btn-60">60 FPS</button>
    </div>

    <!-- Animation Gallery -->
    <div class="gallery">
        
        <!-- Open Page (16:9 ratio, high-res) -->
        <div class="animation-row">
            <h3 class="row-title">Open Page (16:9 High-Res)</h3>
            <div class="sprite-wrapper">
                <div class="sprite-container" style="background-image: url('open_page_sprite_grid.png'); width: 960px; height: 540px;" data-width="960" data-height="540"></div>
            </div>
        </div>

        <!-- Page 1 -->
        <div class="animation-row">
            <h3 class="row-title">Page 1</h3>
            <div class="sprite-wrapper">
                <div class="sprite-container" style="background-image: url('page1_sprite_grid.png');" data-width="300" data-height="300"></div>
            </div>
        </div>

        <!-- Page 2 (Final Sprite Grid) -->
        <div class="animation-row">
            <h3 class="row-title">Page 2</h3>
            <div class="sprite-wrapper">
                <div class="sprite-container" style="background-image: url('final_sprite_grid.png');" data-width="300" data-height="300"></div>
            </div>
        </div>

        <!-- Page 3 -->
        <div class="animation-row">
            <h3 class="row-title">Page 3</h3>
            <div class="sprite-wrapper">
                <div class="sprite-container" style="background-image: url('Page_3_sprite_grid.png');" data-width="300" data-height="300"></div>
            </div>
        </div>

        <!-- Page 4 -->
        <div class="animation-row">
            <h3 class="row-title">Page 4</h3>
            <div class="sprite-wrapper">
                <div class="sprite-container" style="background-image: url('Page_4_sprite_grid.png');" data-width="300" data-height="300"></div>
            </div>
        </div>

        <!-- Page 5 -->
        <div class="animation-row">
            <h3 class="row-title">Page 5</h3>
            <div class="sprite-wrapper">
                <div class="sprite-container" style="background-image: url('Page_5_sprite_grid.png');" data-width="300" data-height="300"></div>
            </div>
        </div>

    </div>

    <script>
        const animators = document.querySelectorAll('.sprite-container');
        const totalFrames = 181;
        const columns = 14; 
        let currentFrame = 0;
        let animationInterval;

        function setFPS(fps) {
            if (animationInterval) clearInterval(animationInterval);
            const delay = 1000 / fps;

            animationInterval = setInterval(() => {
                const row = Math.floor(currentFrame / columns);
                const col = currentFrame % columns;

                animators.forEach(animator => {
                    const fw = parseInt(animator.getAttribute('data-width')) || 300;
                    const fh = parseInt(animator.getAttribute('data-height')) || 300;
                    
                    const x = -(col * fw);
                    const y = -(row * fh);
                    
                    animator.style.backgroundPosition = `${x}px ${y}px`;
                });

                currentFrame = (currentFrame + 1) % totalFrames;
            }, delay);

            document.querySelectorAll('button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${fps}`).classList.add('active');
        }

        // --- Mobile Responsiveness Logic ---
        function handleResize() {
            animators.forEach(animator => {
                const nativeWidth = parseInt(animator.getAttribute('data-width')) || 300;
                const nativeHeight = parseInt(animator.getAttribute('data-height')) || 300;
                
                // Get the available width in the wrapper (parent)
                const wrapper = animator.parentElement;
                const availableWidth = wrapper.clientWidth;
                
                // If the native size is larger than the screen, scale it down
                if (nativeWidth > availableWidth) {
                    const scale = availableWidth / nativeWidth;
                    animator.style.transform = `scale(${scale})`;
                    // Shrink the wrapper's height so it doesn't leave a huge blank space
                    wrapper.style.height = `${nativeHeight * scale}px`;
                } else {
                    // Reset if screen is wide enough
                    animator.style.transform = `scale(1)`;
                    wrapper.style.height = `${nativeHeight}px`;
                }
            });
        }

        // Listen for screen size changes
        window.addEventListener('resize', handleResize);
        
        // Run once on load to fit initial mobile screen sizes
        setTimeout(handleResize, 100);

        // Initialize animation
        setFPS(24);
    </script>
</body>
</html>
