<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprite Animation Gallery</title>
    <style>
        body {
            margin: 0;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 5rem;
        }

        /* Fixed Header for Controls */
        .controls-header {
            position: sticky;
            top: 0;
            width: 100%;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            padding: 1.5rem 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            z-index: 100;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }

        .controls-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #94a3b8;
            margin: 0;
        }

        button {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        button:hover {
            background: rgba(255,255,255,0.1);
            transform: scale(1.05);
        }

        button.active {
            background: rgba(56, 189, 248, 0.2);
            color: #38bdf8;
            border-color: #38bdf8;
        }

        /* Gallery Layout */
        .gallery {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5rem;
            width: 100%;
            max-width: 1000px;
            padding: 4rem 2rem;
            box-sizing: border-box;
        }

        .animation-row {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            background: #1e293b;
            padding: 3rem;
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.4);
        }

        .row-title {
            margin: 0 0 2rem 0;
            font-size: 1.5rem;
            color: #e2e8f0;
            text-transform: capitalize;
            letter-spacing: 1px;
            border-bottom: 2px solid #38bdf8;
            padding-bottom: 0.5rem;
        }

        .sprite-container {
            /* Default fallback sizes */
            width: 300px;
            height: 300px;
            background-repeat: no-repeat;
            background-position: 0px 0px;
            filter: drop-shadow(0 0 20px rgba(56,189,248,0.15));
        }

    </style>
</head>
<body>

    <!-- Floating Sticky Controls -->
    <div class="controls-header">
        <h2 class="controls-title">Playback Speed</h2>
        <button onclick="setFPS(24)" id="btn-24">24 FPS</button>
        <button onclick="setFPS(30)" id="btn-30">30 FPS</button>
        <button onclick="setFPS(60)" id="btn-60">60 FPS</button>
    </div>

    <!-- Animation Gallery -->
    <div class="gallery">
        
        <!-- Open Page (16:9 ratio, high-res) -->
        <div class="animation-row">
            <h3 class="row-title">Open Page (16:9 High-Res)</h3>
            <div class="sprite-container" style="background-image: url('open_page_sprite_grid.png'); width: 960px; height: 540px;" data-width="960" data-height="540"></div>
        </div>

        <!-- Page 1 -->
        <div class="animation-row">
            <h3 class="row-title">Page 1</h3>
            <div class="sprite-container" style="background-image: url('page1_sprite_grid.png');" data-width="300" data-height="300"></div>
        </div>

        <!-- Page 2 (Final Sprite Grid) -->
        <div class="animation-row">
            <h3 class="row-title">Page 2</h3>
            <div class="sprite-container" style="background-image: url('final_sprite_grid.png');" data-width="300" data-height="300"></div>
        </div>

        <!-- Page 3 -->
        <div class="animation-row">
            <h3 class="row-title">Page 3</h3>
            <div class="sprite-container" style="background-image: url('Page_3_sprite_grid.png');" data-width="300" data-height="300"></div>
        </div>

        <!-- Page 4 -->
        <div class="animation-row">
            <h3 class="row-title">Page 4</h3>
            <div class="sprite-container" style="background-image: url('Page_4_sprite_grid.png');" data-width="300" data-height="300"></div>
        </div>

        <!-- Page 5 -->
        <div class="animation-row">
            <h3 class="row-title">Page 5</h3>
            <div class="sprite-container" style="background-image: url('Page_5_sprite_grid.png');" data-width="300" data-height="300"></div>
        </div>

    </div>

    <script>
        // Get all sprite containers on the page
        const animators = document.querySelectorAll('.sprite-container');
        
        // Sprite Sheet Configuration
        const totalFrames = 181;
        const columns = 14; 

        let currentFrame = 0;
        let animationInterval;

        function setFPS(fps) {
            if (animationInterval) clearInterval(animationInterval);

            const delay = 1000 / fps;

            animationInterval = setInterval(() => {
                const row = Math.floor(currentFrame / columns);
                const col = currentFrame % columns;

                // Update every single animator with its own specific frame dimensions
                animators.forEach(animator => {
                    const fw = parseInt(animator.getAttribute('data-width')) || 300;
                    const fh = parseInt(animator.getAttribute('data-height')) || 300;
                    
                    const x = -(col * fw);
                    const y = -(row * fh);
                    
                    animator.style.backgroundPosition = `${x}px ${y}px`;
                });

                currentFrame = (currentFrame + 1) % totalFrames;
            }, delay);

            // Update UI buttons
            document.querySelectorAll('button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${fps}`).classList.add('active');
        }

        // Initialize at 24 FPS when the page loads
        setFPS(24);
    </script>
</body>
</html>
